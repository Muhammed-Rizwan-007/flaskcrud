
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="flask crud" />
  <title>flaskcrud</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      color: #172033;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 10%, #e5edff 0, transparent 34%),
        radial-gradient(circle at 90% 85%, #e4f7f0 0, transparent 30%),
        #f7f8fc;
    }

    .card {
      width: min(100%, 620px);
      background: rgba(255, 255, 255, .94);
      border: 1px solid #e7eaf1;
      border-radius: 24px;
      padding: 42px;
      box-shadow: 0 24px 70px rgba(31, 46, 82, .10);
    }

    .eyebrow {
      color: #5367d9;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .icon {
      width: 66px;
      height: 66px;
      display: grid;
      place-items: center;
      margin: 20px 0 22px;
      border-radius: 18px;
      background: #eef1ff;
      font-size: 34px;
    }

    h1 {
      margin: 0;
      font-size: clamp(29px, 6vw, 42px);
      letter-spacing: -.04em;
      line-height: 1.1;
    }

    .intro {
      margin: 14px 0 26px;
      color: #647086;
      font-size: 16px;
      line-height: 1.7;
    }

    .details {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 26px;
    }

    .pill {
      padding: 8px 12px;
      border-radius: 999px;
      background: #f2f4f8;
      color: #465168;
      font-size: 13px;
      font-weight: 650;
    }

    .download {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      width: 100%;
      padding: 17px 22px;
      border-radius: 13px;
      background: #4356d8;
      color: white;
      text-decoration: none;
      font-weight: 750;
      font-size: 16px;
      box-shadow: 0 9px 20px rgba(67, 86, 216, .22);
      transition: transform .15s, background .15s;
    }

    .download:hover {
      background: #3548c5;
      transform: translateY(-2px);
    }

    .download:focus-visible {
      outline: 3px solid #aab4ff;
      outline-offset: 4px;
    }

    .hint {
      margin: 13px 0 0;
      text-align: center;
      color: #8992a3;
      font-size: 12px;
    }

    .contents {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #edf0f5;
    }

    .contents h2 {
      margin: 0 0 13px;
      font-size: 14px;
    }

    .folders {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .folder {
      background: #fafbfe;
      border: 1px solid #e9edf4;
      border-radius: 8px;
      padding: 7px 10px;
      color: #58647a;
      font-size: 12px;
    }

    footer {
      margin-top: 26px;
      color: #9aa2b1;
      text-align: center;
      font-size: 11px;
    }

    @media (max-width: 520px) {
      .card {
        padding: 28px 22px;
        border-radius: 19px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="eyebrow">
      Practical programs collection
    </div>

    <div class="icon" aria-hidden="true">📁</div>

    <h1>flask</h1>

    <p class="intro">
      flask crud operations
    </p>

    <div class="details">
      <span class="pill">15 program folders</span>
      <span class="pill">ZIP archive</span>
      <span class="pill">80 KB</span>
    </div>

    <a class="download" href="flaskcrud (2).zip" download>
      <span aria-hidden="true">⬇</span>
      Download All Programs
    </a>

    <p class="hint">
      Your download will start when you click the button.
    </p>

    <section class="contents" aria-label="Included folders">

      <h2>Included folders</h2>

      <div class="folders">
        <span class="folder">WEB1 – WEB14</span>
        <span class="folder">DJANGO_DEPLOYMENT</span>
      </div>

    </section>

    <footer>
      Static download page · No login required
    </footer>

  </main>

</body>
</html>
